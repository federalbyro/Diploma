x-app-build: &app-build
  context: .
  dockerfile: Dockerfile.app

services:
  postgres:
    image: postgres:16
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  qdrant:
    image: qdrant/qdrant:v1.14.1
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__LOG_LEVEL=warn

  migrations:
    build: *app-build
    command: ["alembic", "upgrade", "head"]
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    volumes:
      - model_cache:/models
      - uploads:/tmp/uploads

  model_downloader:
    build: *app-build
    command:
      - python
      - -c
      - "from shared.core.encoder import get_model; get_model(); print('[model_downloader] ready.')"
    env_file: .env
    volumes:
      - model_cache:/models
    restart: "no"

  catalog_service:
    build: *app-build
    command: ["uvicorn", "catalog.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
      model_downloader:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    volumes:
      - model_cache:/models
      - uploads:/tmp/uploads

  catalog_worker:
    build: *app-build
    command: ["celery", "-A", "catalog.tasks.celery_app:celery_app", "worker",
              "--loglevel=INFO", "--concurrency=1"]
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      qdrant:
        condition: service_started
      migrations:
        condition: service_completed_successfully
      model_downloader:
        condition: service_completed_successfully
    volumes:
      - model_cache:/models
      - uploads:/tmp/uploads

  client_service:
    build: *app-build
    command: ["uvicorn", "client.main:app", "--host", "0.0.0.0", "--port", "8001"]
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      migrations:
        condition: service_completed_successfully
      model_downloader:
        condition: service_completed_successfully
    ports:
      - "8001:8001"
    volumes:
      - model_cache:/models

volumes:
  postgres_data:
  qdrant_data:
  model_cache:
  uploads: