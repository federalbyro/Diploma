[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "diploma"
version = "3.0.0"
requires-python = ">=3.11"

# ── Core runtime ──────────────────────────────────
dependencies = [
    # Web
    "fastapi==0.115.12",
    "uvicorn[standard]==0.34.2",
    "python-multipart==0.0.20",

    # Database
    "sqlalchemy==2.0.40",
    "psycopg2-binary==2.9.10",
    "alembic==1.15.2",

    # Config / validation
    "pydantic==2.11.4",
    "pydantic-settings==2.9.1",

    # Queue
    "celery==5.5.2",
    "redis==6.1.0",

    # Vector DB
    "qdrant-client==1.14.2",

    # Data processing
    "pandas==2.2.2",
    "openpyxl==3.1.5",
]

# ── Dependency groups ─────────────────────────────
[dependency-groups]

model = [
    "sentence-transformers==4.1.0",
    "torch==2.7.0",
]

test = [
    "pytest==8.3.5",
    "httpx==0.28.1",
]

# ── uv: CPU-only torch ────────────────────────────
[tool.uv]
default-groups = ["model", "test"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# ── Hatchling (build backend) ─────────────────────
[tool.hatch.build.targets.wheel]
packages = ["catalog", "client", "shared"]